services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: worklog
      POSTGRES_USER: postgres
      # Local development only. It matches DATABASE_URL in .env.example.
      POSTGRES_PASSWORD: worklog
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worklog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
